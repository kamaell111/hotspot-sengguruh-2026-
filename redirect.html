<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <!-- Redirect otomatis setelah 3 detik ke halaman awal pengguna -->
    <meta
      http-equiv="refresh"
      content="3;url=status.html"
    />
    <title>Login Berhasil — Spektakuler Sengguruh 2026</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <div class="portal">
      <div class="ribbon"></div>

      <!-- SISI HEADER: Pemdes Sengguruh & JSN -->
      <header
        class="site-header"
        style="display: flex; justify-content: space-between; align-items: center; padding: 16px 14px 5px; width: 100%; box-sizing: border-box"
      >
        <!-- SISI KIRI: Logo Kabupaten Malang & Teks Pemdes -->
        <div
          class="brand"
          style="display: flex; align-items: center; gap: 8px"
        >
          <!-- Ukuran disesuaikan jadi 40px (Tengah-tengah, pas dan proporsional) -->
          <div
            class="crest"
            style="width: 40px; height: 45px; display: flex; align-items: center; justify-content: center"
          >
            <img
              src="images/peta-5.png"
              alt="Logo Kabupaten Malang"
              style="width: 100%; height: 100%; object-fit: contain"
            />
          </div>
          <div
            class="brand-text"
            style="line-height: 1.15; text-align: left"
          >
            <div
              class="kabupaten"
              style="font-size: 8.5px; font-weight: 700; color: #555; letter-spacing: 0.5px"
            >
              PEMDES
            </div>
            <div
              class="nama"
              style="font-size: 13.5px; font-weight: 800; color: #1a2a5e"
            >
              SENGGURUH
            </div>
          </div>
        </div>

        <!-- SISI KANAN: JSN (Dikembalikan numpuk atas-bawah dengan ukuran pas) -->
        <div
          class="isp"
          style="display: flex; flex-direction: column; align-items: flex-end; text-align: right; margin-top: 6px"
        >
          <!-- Logo JSN lebarnya 65px -->
          <img
            src="images/logo-jsn.png"
            alt="Logo JSN"
            style="width: 65px; height: auto; object-fit: contain; margin-bottom: 3px"
          />
          <div
            class="isp-sub"
            style="font-size: 8px; line-height: 1.1; color: #444"
          >
            PT. JARINGANKU<br /><span style="color: #3b6fd6; font-weight: 600">SARANA NUSANTARA</span>
          </div>
        </div>
      </header>

      <div class="center-page">
        <!-- Ikon Centang Hijau -->
        <div
          class="badge"
          style="background: linear-gradient(160deg, #eaf7ee, #d3f0db)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="var(--hijau-aktif)"
          >
            <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z" />
          </svg>
        </div>
        <h1>Login Berhasil!</h1>
        <p class="desc">
          Selamat menikmati akses WiFi gratis <strong style="color: var(--merah)">Spektakuler Sengguruh 2026</strong>.<br />
          Anda akan dialihkan secara otomatis...
        </p>

        <!-- Loading Spinner -->
        <div class="spinner"></div>

        <p style="margin-top: 18px; font-size: 12px; color: #888">
          Jika tidak dialihkan otomatis,
          <!-- Link manual yang aman -->
          <a
            href="status.html"
            style="color: var(--merah); font-weight: 600; text-decoration: none"
            >klik di sini</a
          >
        </p>
      </div>

      <div
        class="tagline"
        style="margin-top: 30px"
      >
        Bangga Budaya, Maju Bersama!
        <div class="underline"></div>
      </div>

      <div
        class="powered-wrap"
        style="margin-top: 20px"
      >
        <div class="powered">
          <p>Powered by :</p>
          <strong>PT. JARINGANKU SARANA NUSANTARA</strong>
        </div>
      </div>
    </div>
  </body>
</html>
